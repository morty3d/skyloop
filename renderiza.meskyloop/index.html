<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Skyloop 3D</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f4f4f2;
      font-family: Arial, Helvetica, sans-serif;
    }

    #viewer {
      width: 100%;
      height: 100%;
      position: relative;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }


    /* LOADING */

    #loading {
      position: absolute;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #f4f4f2;

      z-index: 10;

      transition:
        opacity 0.5s ease,
        visibility 0.5s ease;
    }

    #loading.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loader {
      width: 34px;
      height: 34px;

      border: 2px solid rgba(0, 0, 0, 0.12);
      border-top-color: #111;

      border-radius: 50%;

      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

  </style>
</head>


<body>

  <div id="viewer">

    <div id="loading">
      <div class="loader"></div>
    </div>

  </div>


  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>


  <script type="module">

    import * as THREE from "three";

    import { OrbitControls }
    from "three/addons/controls/OrbitControls.js";

    import { GLTFLoader }
    from "three/addons/loaders/GLTFLoader.js";
    import { RGBELoader }
from "three/addons/loaders/RGBELoader.js";


    /* ---------------------------------------------------------
       ESCENA
    --------------------------------------------------------- */

    const viewer = document.getElementById("viewer");
    const loading = document.getElementById("loading");

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0x1a1a1a);



    /* ---------------------------------------------------------
       CAMARA
    --------------------------------------------------------- */

    const camera = new THREE.PerspectiveCamera(
      35,
      window.innerWidth / window.innerHeight,
      0.01,
      10000
    );

    camera.position.set(4, 3, 6);



    /* ---------------------------------------------------------
       RENDER
    --------------------------------------------------------- */

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false
    });

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.outputColorSpace = THREE.SRGBColorSpace;

    renderer.toneMapping =
      THREE.ACESFilmicToneMapping;

    renderer.toneMappingExposure = .8;

    renderer.shadowMap.enabled = true;

    renderer.shadowMap.type =
      THREE.PCFSoftShadowMap;

    viewer.appendChild(renderer.domElement);



    /* ---------------------------------------------------------
       CONTROLES
    --------------------------------------------------------- */

    const controls =
      new OrbitControls(
        camera,
        renderer.domElement
      );

    controls.enableDamping = true;

    controls.dampingFactor = 0.06;

    controls.enablePan = true;

    controls.enableZoom = true;

    controls.enableRotate = true;

    controls.autoRotate = true;

    controls.autoRotateSpeed = 0.45;



    /* ---------------------------------------------------------
       ILUMINACION
    --------------------------------------------------------- */

    const hemisphere =
      new THREE.HemisphereLight(
        0xffffff,
        0xd8d8d8,
        0
      );

    scene.add(hemisphere);



    const keyLight =
      new THREE.DirectionalLight(
        0xffffff,
        0
      );

    keyLight.position.set(
      5,
      8,
      6
    );

    keyLight.castShadow = true;

    scene.add(keyLight);



    const fillLight =
      new THREE.DirectionalLight(
        0xffffff,
        0
      );

    fillLight.position.set(
      -5,
      3,
      4
    );

    scene.add(fillLight);



    const backLight =
      new THREE.DirectionalLight(
        0xffffff,
        0
      );

    backLight.position.set(
      0,
      5,
      -6
    );

    scene.add(backLight);

/* ---------------------------------------------------------
   HDRI
--------------------------------------------------------- */

const rgbeLoader = new RGBELoader();

rgbeLoader.load(
  "./assets/hdr1.hdr",
  function (texture) {

    texture.mapping =
      THREE.EquirectangularReflectionMapping;

    /* HDR usado como iluminación/reflejos */
    scene.environment = texture;

    /* NO mostramos el HDR de fondo */
    scene.background =
      new THREE.Color(0x1a1a1a);
       // intensidad del HDRI
    scene.environmentIntensity = 1.1;

  },

  undefined,

  function (error) {

    console.error(
      "Error cargando HDR:",
      error
    );

  }
);

    /* ---------------------------------------------------------
       CARGAR SKYLOOP
    --------------------------------------------------------- */

    const loader =
      new GLTFLoader();


    loader.load(

      "./assets/skyloop.glb",


      function (gltf) {

        const model = gltf.scene;

        scene.add(model);



        /* sombras */

        model.traverse((child) => {

          if (child.isMesh) {

            child.castShadow = true;
            child.receiveShadow = true;

          }

        });



        /* calcular tamaño */

        const box =
          new THREE.Box3()
          .setFromObject(model);

        const center =
          box.getCenter(
            new THREE.Vector3()
          );

        const size =
          box.getSize(
            new THREE.Vector3()
          );



        /* centrar modelo */

        model.position.x -= center.x;
        model.position.y -= center.y;
        model.position.z -= center.z;



        /* tamaño máximo */

        const maxDim =
          Math.max(
            size.x,
            size.y,
            size.z
          );



        /* distancia automática cámara */

        const fov =
          camera.fov *
          (Math.PI / 180);

        let cameraDistance =
          Math.abs(
            maxDim /
            (2 * Math.tan(fov / 2))
          );

        cameraDistance *= 1.55;



        camera.position.set(

          cameraDistance * 0.75,

          cameraDistance * 0.45,

          cameraDistance

        );



        camera.near =
          maxDim / 100;

        camera.far =
          maxDim * 100;

        camera.updateProjectionMatrix();



        controls.target.set(
          0,
          0,
          0
        );

        controls.minDistance =
          maxDim * 0.6;

        controls.maxDistance =
          maxDim * 5;

        controls.update();



        /* ocultar loading */

        loading.classList.add(
          "hidden"
        );

      },



      function (xhr) {

        if (xhr.total) {

          const porcentaje =
            xhr.loaded /
            xhr.total *
            100;

          console.log(
            Math.round(porcentaje)
            + "% cargado"
          );

        }

      },



      function (error) {

        console.error(
          "Error cargando Skyloop:",
          error
        );

      }

    );



    /* ---------------------------------------------------------
       DETENER AUTOROTACION
       CUANDO EL USUARIO INTERACTUA
    --------------------------------------------------------- */

    renderer.domElement.addEventListener(
      "pointerdown",
      () => {

        controls.autoRotate = false;

      }
    );



    renderer.domElement.addEventListener(
      "wheel",
      () => {

        controls.autoRotate = false;

      }
    );



    /* ---------------------------------------------------------
       RESIZE
    --------------------------------------------------------- */

    window.addEventListener(
      "resize",
      () => {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );



    /* ---------------------------------------------------------
       ANIMACION
    --------------------------------------------------------- */

    function animate() {

      requestAnimationFrame(
        animate
      );

      controls.update();

      renderer.render(
        scene,
        camera
      );

    }

    animate();


  </script>

</body>
</html>
